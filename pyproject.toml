[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sendry"
version = "0.2.0"
description = "The official Python SDK for the Sendry email API"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Sendry", email = "support@sendry.online" }]
requires-python = ">=3.9"
keywords = ["email", "sendry", "api", "sdk", "transactional"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "mypy>=1.9",
]

[project.urls]
Homepage = "https://sendry.online"
Documentation = "https://docs.sendry.online/sdk/python"
Repository = "https://github.com/sendry-dev/sendry-python"
"Bug Tracker" = "https://github.com/sendry-dev/sendry-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["sendry"]

[tool.hatch.build.targets.sdist]
include = [
    "sendry",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = false
disable_error_code = ["no-any-return"]
